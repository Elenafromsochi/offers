<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>НУТРИЛОГИЯ — платформа спортивных нутрициологов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E9ECF5;
  --bg:#F6F7FB; --surface:#FFFFFF; --surface2:#EEF0F7;
  --ink:#1C1F2A; --muted:#5A6072; --line:#E1E4EF;
  --leaf:#2F6BFF; --leaf-d:#1F4FD6; --leaf-soft:#E8EFFF;
  --tomato:#E5484D; --tomato-press:#C93A3F;
  --cobalt:#7B5CFF; --cobalt-soft:#F0EBFF;
  --gold:#6A4DF0; --gold-soft:#F0EBFF;
  --grad:linear-gradient(120deg,#2F6BFF 0%,#5A63FF 50%,#7B5CFF 100%);
  --glow:0 0 0 1px rgba(47,107,255,.2),0 8px 26px -8px rgba(47,107,255,.5);
  --shadow:0 1px 2px rgba(28,31,42,.04),0 12px 30px -16px rgba(40,50,110,.28);
  --display:'Manrope','Segoe UI',Roboto,Arial,sans-serif;
  --body:'Manrope','Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#0B0D14; --bg:#10131C; --surface:#171B26; --surface2:#1D2230;
    --ink:#EDEFF6; --muted:#9AA1B6; --line:#2A3042;
    --leaf:#5B8BFF; --leaf-d:#7FA4FF; --leaf-soft:#1A2548;
    --tomato:#FF6B6F; --tomato-press:#F05458;
    --cobalt:#9B84FF; --cobalt-soft:#261F4A;
    --gold:#A792FF; --gold-soft:#261F4A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --desk:#0B0D14; --bg:#10131C; --surface:#171B26; --surface2:#1D2230;
    --ink:#EDEFF6; --muted:#9AA1B6; --line:#2A3042;
    --leaf:#5B8BFF; --leaf-d:#7FA4FF; --leaf-soft:#1A2548;
    --tomato:#FF6B6F; --tomato-press:#F05458;
    --cobalt:#9B84FF; --cobalt-soft:#261F4A;
    --gold:#A792FF; --gold-soft:#261F4A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
@media (min-width:600px){.app{box-shadow:0 0 0 1px var(--line),0 30px 80px -40px rgba(19,36,27,.4)}}
main{padding:14px 18px calc(104px + env(safe-area-inset-bottom,0px))}
.sub-mode main{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}

h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;letter-spacing:.005em}
h1{font-size:34px;line-height:1.02}
h2{font-size:24px;line-height:1.1}
h3{font-size:20px;line-height:1.15;font-weight:700}
.muted{color:var(--muted)}
.num{font-family:var(--display);font-weight:800}
.sect{margin-top:26px}
.sect-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sect-head .muted{font-size:14px}
.ic{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:4px}
.top small{display:block;color:var(--muted);font-size:14px;margin-bottom:2px}
.xp{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.xp .ic{width:17px;height:17px;color:var(--gold)}

/* route track (signature) */
.route{margin-top:18px;background:var(--ink);color:#fff;border-radius:24px;padding:18px 16px 16px;position:relative;overflow:hidden}
:root[data-theme="dark"] .route{background:#0B130F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .route{background:#0B130F}}
.route .rt{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.route .big{font-family:var(--display);font-weight:800;font-size:48px;line-height:.9}
.route .big span{font-size:22px;opacity:.6;font-weight:700}
.route .lbl{font-size:14px;opacity:.7}
.route svg{display:block;width:100%;height:auto;margin-top:14px}
.route .foot{display:flex;justify-content:space-between;font-size:13px;opacity:.75;margin-top:6px}

/* next lesson */
.next{padding:16px}
.next .tch{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--muted)}
.next .btn{margin-top:14px}
.ava{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;width:36px;height:36px;font-size:13px}
.dl{display:flex;gap:12px;align-items:center;padding:14px 16px;margin-top:10px;background:var(--cobalt-soft);border-radius:18px}
.dl .ic{color:var(--cobalt)}
.dl b{display:block;font-size:15px}
.dl small{color:var(--muted);font-size:14px}
.dl .days{margin-left:auto;text-align:right;font-family:var(--display);font-weight:800;font-size:26px;color:var(--cobalt);line-height:1}
.dl .days small{display:block;font-family:var(--body);font-weight:500;font-size:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:700;font-size:16px;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-main{background:var(--tomato);color:#fff}
.btn-main:hover{background:var(--tomato-press)}
.btn-main[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line)}
.btn-soft{background:var(--leaf-soft);color:var(--leaf-d)}
.btn-block{width:100%}
.btn .ic{width:19px;height:19px}

/* case of the day */
.case{padding:16px}
.case .q{font-weight:600;font-size:16px;margin:8px 0 12px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;font-size:15px;background:var(--surface)}
.opt.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.opt.bad{border-color:var(--tomato);opacity:.7}
.opt[disabled]{cursor:default}
.expl{font-size:14px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:11px 13px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.chip .ic{width:14px;height:14px}
.chip-gold{background:var(--gold-soft);color:var(--gold)}
.chip-leaf{background:var(--leaf-soft);color:var(--leaf-d)}
.chip-cobalt{background:var(--cobalt-soft);color:var(--cobalt)}
.chip-mute{background:var(--surface2);color:var(--muted)}

/* clients */
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:2px 18px 8px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.client{flex:none;width:250px;scroll-snap-align:start;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px}
.clients-grid .client{width:auto}
.client .ch{display:flex;gap:12px;align-items:center}
.client .sp{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.client .ch b{display:block;font-size:16px;line-height:1.2}
.client .ch small{color:var(--muted);font-size:13px}
.season{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.season i{height:6px;border-radius:3px;background:var(--line)}
.season i.on{background:var(--cobalt)}
.season-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-5px}
.client.locked{opacity:.6}
.client p{margin:0;font-size:14px;color:var(--muted)}
.clients-grid{display:grid;gap:10px}

/* program */
.hours{padding:16px}
.hours .row{display:flex;justify-content:space-between;align-items:baseline}
.hbar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:10px;display:flex;gap:2px}
.hbar i{display:block;height:100%}
.mod{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px}
.mod .no{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;background:var(--surface2);color:var(--muted)}
.mod.done .no{background:var(--leaf);color:#fff}
.mod.cur{box-shadow:0 0 0 2px var(--cobalt),var(--shadow)}
.mod.cur .no{background:var(--cobalt);color:#fff}
.mod.lock{opacity:.62}
.mod b{display:block;font-size:15px;line-height:1.25}
.mod small{color:var(--muted);font-size:13px}
.mod .rgt{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.mod .rgt strong{display:block;font-family:var(--display);font-size:20px;color:var(--ink)}
.mprog{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.mprog i{display:block;height:100%;background:var(--cobalt)}

/* teachers */
.tch-card{padding:16px;display:grid;grid-template-columns:64px 1fr;gap:14px;margin-bottom:10px}
.tch-card .ava{width:64px;height:64px;font-size:20px;border-radius:20px}
.tch-card b{display:block;font-size:17px}
.tch-card p{margin:4px 0 8px;font-size:14px;color:var(--muted)}
.tch-card .mods{display:flex;gap:6px;flex-wrap:wrap}

/* lesson */
.back-btn{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px;margin:4px 0 10px}
.player{position:relative;margin-top:14px;border-radius:20px;overflow:hidden;background:#0E1A14;aspect-ratio:16/9;width:100%;display:block;color:#fff;text-align:left}
.player .grid{position:absolute;inset:0;opacity:.18}
.player .pbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:var(--tomato);display:grid;place-items:center}
.player .pbtn .ic{fill:#fff;stroke:#fff;width:22px;height:22px;margin-left:3px}
.player .meta{position:absolute;left:14px;bottom:16px;font-size:13px;opacity:.85}
.player .prot{position:absolute;right:12px;top:12px;font-size:12px;opacity:.7;display:flex;gap:5px;align-items:center}
.player .prot .ic{width:14px;height:14px}
.player .pb{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.15)}
.player .pb i{display:block;height:100%;background:var(--tomato);transition:width 2.4s linear}
.segs{display:flex;gap:6px;overflow-x:auto;margin:16px -18px 0;padding:0 18px}
.segs button{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:14px;font-weight:600}
.segs button.act{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pane{margin-top:14px}
.pane p{margin:0 0 10px}
.lit{padding:12px 14px;margin-bottom:8px;font-size:14px}
.lit b{display:block;font-size:15px}
.tq{padding:14px;margin-bottom:10px}
.tq .q{font-weight:600;margin-bottom:10px}
.task{padding:16px}
.task p{margin:6px 0 12px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--muted);font-size:14px;width:100%;display:block}
.file{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14px}
textarea.ta{display:block;width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;min-height:90px;resize:vertical;font-size:15px;margin-top:10px}
.status{display:flex;gap:10px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--cobalt-soft);margin-top:10px;font-size:15px}
.status .ic{color:var(--cobalt)}
.qa{padding:14px;margin-top:10px}
.qa .msg{display:flex;gap:10px;margin-bottom:12px}
.qa .msg:last-child{margin-bottom:0}
.qa .msg .ava{width:30px;height:30px;font-size:11px}
.qa .msg b{font-size:14px}
.qa .msg p{margin:2px 0 0;font-size:14px}
.actionbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.actionbar small{display:block;text-align:center;color:var(--muted);font-size:13px;margin-top:6px}

/* profile */
.me{display:flex;gap:14px;align-items:center;padding-top:6px}
.me .ava{width:64px;height:64px;font-size:22px}
.acad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acad div{padding:12px}
.acad b{display:block;font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.acad small{color:var(--muted);font-size:13px}
.ladder{display:flex;gap:4px}
.ladder div{flex:1;font-size:12px;color:var(--muted);text-align:center}
.ladder i{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:6px}
.ladder .got i{background:var(--gold)}
.ladder .cur{color:var(--ink);font-weight:700}
.diploma{padding:16px;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.diploma .paper{aspect-ratio:1/1.41;border-radius:6px;background:var(--surface2);border:1.5px solid var(--line);position:relative;overflow:hidden}
.diploma .paper i{position:absolute;left:12%;right:12%;height:4px;border-radius:2px;background:var(--line)}
.diploma .paper .qr{position:absolute;right:10%;bottom:8%;width:26%;aspect-ratio:1;background:repeating-linear-gradient(90deg,var(--muted) 0 2px,transparent 2px 4px),repeating-linear-gradient(0deg,var(--muted) 0 2px,transparent 2px 4px);opacity:.35;border-radius:2px}
.diploma small{color:var(--muted);font-size:14px}
.pf{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:8px}
.pf .ic{color:var(--leaf-d)}
.pf div{flex:1;font-size:15px;font-weight:600;line-height:1.25}
.pf small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.rate div{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:15px}
.rate div:last-child{border:0}
.rate .pos{width:18px;color:var(--muted);font-weight:700}
.rate .nm{flex:1}
.rate .you{background:var(--gold-soft);font-weight:700}
.sup{padding:16px}
.calc{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:8px 0;margin:12px 0}
.calc div{display:flex;justify-content:space-between;padding:3px 0;font-size:15px}
.calc .tot{font-weight:700;font-size:17px}
.fine{font-size:13px;color:var(--muted);margin-top:8px}
.switch{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;margin-top:10px}
.switch div{flex:1}
.switch small{display:block;color:var(--muted);font-size:13px}

/* teacher */
.tbanner{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;font-size:14px}
.tbanner button{margin-left:auto;font-weight:700;text-decoration:underline;color:var(--bg)}
.qitem{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:13px 14px;margin-bottom:8px;width:100%;text-align:left}
.qitem b{display:block;font-size:15px;line-height:1.25}
.qitem small{color:var(--muted);font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi div{padding:12px}
.kpi b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.kpi small{color:var(--muted);font-size:13px}
.answer{padding:14px;font-size:15px}

/* tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);padding:4px 0;border-radius:12px}
.tabs button.act{color:var(--ink);font-weight:700}
.tabs button.act .ic{stroke-width:2.3;color:var(--cobalt)}
.sub-mode .tabs{display:none}

/* layers */
.layer{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,20,15,.45)}
.sheet{width:min(100%,440px);background:var(--bg);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow:auto;animation:up .28s cubic-bezier(.3,.7,.2,1)}
.sheet .grip{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.lv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px}
.lv .st{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:none}
.lv.done .st{background:var(--leaf);border-color:var(--leaf);color:#fff}
.lv.done .st .ic{width:15px;height:15px;stroke-width:3}
.lv.cur{box-shadow:0 0 0 2px var(--cobalt)}
.lv.cur .st{border-color:var(--cobalt);color:var(--cobalt)}
.lv[disabled]{opacity:.55;cursor:default}
.lv span.tx{flex:1;font-weight:600;font-size:15px;line-height:1.25}
.lv small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;white-space:nowrap;animation:up .25s}
.float{position:fixed;z-index:30;font-weight:800;color:var(--gold);pointer-events:none;animation:fl .9s ease-out forwards;font-family:var(--display);font-size:22px}
@keyframes fl{to{transform:translateY(-44px);opacity:0}}
.note{font-size:12px;color:var(--muted);margin-top:22px;text-align:center}
/* вход и учебный отдел */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:40px;line-height:.95;letter-spacing:.01em}
.brand-sub{color:var(--muted);font-size:15px;margin-top:8px}
.brand-track{display:flex;gap:3px;margin:22px 0 26px}
.brand-track i{height:8px;border-radius:3px;background:var(--line)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input{display:block;width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:13px 14px;font-size:16px}
.field input:focus-visible{outline:3px solid var(--cobalt);outline-offset:1px}
.err{color:var(--tomato);font-size:14px;margin:-4px 0 10px}
.info{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);margin-top:16px}
.info .ic{width:19px;height:19px;color:var(--ink);margin-top:1px}
.demo{margin-top:22px;border-top:1.5px dashed var(--line);padding-top:16px}
.demo small{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}
.demo .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.demo button{border:1.5px solid var(--line);border-radius:12px;padding:9px 4px;font-size:13px;font-weight:600;background:var(--surface)}
.rules{list-style:none;padding:0;margin:6px 0 14px;font-size:14px}
.rules li{display:flex;gap:8px;align-items:center;color:var(--muted);margin-bottom:4px}
.rules li .ic{width:16px;height:16px}
.rules li.ok{color:var(--leaf-d)}

function lesson(){
  const m=MODS[S.cur], t=TEACH[m.tc], li=S.curDone;
  const lname=m.lessons?m.lessons[li]:`Урок ${li+1}`;
  const tests=[
    {q:'Что лежит в основе расчёта суточных энергозатрат спортсмена?',o:['Основной обмен с поправкой на активность и тренировочную нагрузку','Только масса тела','Калорийность привычного рациона'],a:0},
    {q:'Что нужно уточнить до расчёта рациона в первую очередь?',o:['Цели, вид спорта и этап сезона','Любимые продукты','Рост и возраст, остальное не важно'],a:0},
  ];
  const testDone=tests.every((x,i)=>S.testAns[i]===x.a);
  const ready=S.watched && testDone && (S.file || S.answer.trim().length>=30);
  const hint=!S.watched?'Досмотрите видео: засчитывается от 90 %':!testDone?'Ответьте на вопросы теста':!(S.file||S.answer.trim().length>=30)?'Прикрепите файл или опишите решение':'После проверки: +50 опыта';
  const segs=[['notes','Конспект'],['lit','Литература'],['test','Тест'],['task','Задание'],['qa','Вопросы']];
  let body='';
  if(pane==='notes') body=`<div class="card" style="padding:16px"><p>Расчёт начинается с оценки основного обмена. Выбор формулы зависит от доступных данных: если известен состав тела, точнее формулы, учитывающие безжировую массу.</p><p style="margin:0">Затем добавляем затраты на тренировки по фактическому объёму и интенсивности, а не усреднённым коэффициентом. Для кейса Игоря учитываем длительные пробежки выходного дня отдельно.</p></div>`;
  if(pane==='lit') body=[['Позиция международного общества спортивного питания по энергетическим потребностям','Обзор, PDF'],['Методы оценки основного обмена у спортсменов','Статья, PDF'],['Таблица поправок на вид нагрузки','Материал преподавателя']].map(([a,b])=>`<div class="card lit"><b>${a}</b><span class="muted">${b}</span></div>`).join('');
  if(pane==='test') body=tests.map((x,i)=>`<div class="card tq"><div class="q">${i+1}. ${x.q}</div>${x.o.map((o,j)=>{const a=S.testAns[i]; const cls=a===undefined?'':j===x.a&&a===j?'ok':a===j?'bad':''; return `<button class="opt ${cls}" onclick="answerTest(${i},${j})">${o}</button>`;}).join('')}</div>`).join('')+(testDone?`<div class="status" style="background:var(--leaf-soft)">${ic('check')}Тест пройден, можно переходить к заданию</div>`:'');
  if(pane==='task') body= S.submitted ? `<div class="status">${ic('clock')}<div><b>Работа на проверке</b><br><small class="muted">Мария Лебедева проверит в течение 3 рабочих дней</small></div></div>` :
    `<div class="card task"><span class="chip chip-cobalt">${ic('runner')}Кейс: Игорь, марафон</span>
      <p>Рассчитайте суточные энергозатраты Игоря на этапе подготовки. Опишите, какую формулу выбрали и какие поправки внесли.</p>
      ${S.file?`<div class="file">${ic('file')}<span style="flex:1">Расчёт_Игорь.xlsx</span><button onclick="S.file=false;save();render()" class="muted">Убрать</button></div>`:`<button class="drop" onclick="S.file=true;save();render()">${ic('upload')}<br>Прикрепить файл с расчётом</button>`}
      <textarea class="ta" oninput="S.answer=this.value;save();refresh()" placeholder="Комментарий к решению">${S.answer}</textarea></div>`;
  if(pane==='qa') body=`<div class="card qa">
      <div class="msg"><span class="ava" style="background:#2F6BFF">ПК</span><div><b>Павел Ким</b><p>Если у спортсмена нет данных о составе тела, какую формулу брать?</p></div></div>
      <div class="msg">${ava(t)}<div><b>${t.n}</b><p>Миффлина — Сан-Жеора как базовую, и обязательно отметьте в работе, что это оценка с погрешностью.</p></div></div></div>
      <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="toast('Вопрос отправлен преподавателю')">${ic('msg')}Задать вопрос</button>`;
  return `
  <button class="back-btn" onclick="closeSub()">${ic('back')}${m.t}</button>
  <small class="muted">Модуль ${S.cur+1}, урок ${li+1} из ${m.l}</small>
  <h1 style="font-size:30px;margin-top:2px">${lname}</h1>
  <button class="player" onclick="watch()" aria-label="Смотреть видео">
    ${playerGrid()}<span class="prot">${ic('shield')}Защищённое видео</span>
    <span class="pbtn">${S.watched?ic('check'):ic('play')}</span>
    <span class="meta">${t.n}, 24 минуты${S.watched?', просмотрено':''}</span>

  </button>
  <div class="segs" role="tablist">${segs.map(([k,l])=>`<button role="tab" class="${pane===k?'act':''}" aria-selected="${pane===k}" onclick="setPane('${k}')">${l}</button>`).join('')}</div>
  <div class="pane">${body}</div>
  ${S.submitted?'':`<div class="actionbar"><button class="btn btn-main btn-block" id="sb" ${ready?'':'disabled'} onclick="submitWork()">Отправить на проверку</button><small id="hint">${hint}</small></div>`}`;
}

function publishLesson(){
  if(!E.t.trim()){ toast('Укажите название урока'); return; }

}
const NEV=[['newLesson','Открыт новый урок или модуль'],['deadline','Дедлайн через 2 дня'],['checked','Работа проверена'],['answer','Ответ на вопрос'],['live','Эфир через час'],['access','Доступ и смена пароля']];
function notifyScreen(){
  const N=S.notif||{newLesson:[1,1],deadline:[1,1],checked:[1,1],answer:[0,1],live:[0,1],access:[1,0]};
  return `${aBanner()}
  <header class="top" style="margin-top:14px"><div><small>Для всех потоков</small><h1>Уведомления</h1></div></header>
  <section class="sect" style="margin-top:16px"><div class="sect-head"><h2>Каналы</h2></div>
    <div class="card pf">${ic('mail')}<div>Почта<small>Отправитель noreply@nutrilogia.ru, домен подтверждён</small></div><span class="chip chip-leaf">Работает</span></div>
    <div class="card pf">${ic('send')}<div>Telegram-бот @nutrilogia_bot<small>Подключили 34 из 38 слушателей потока</small></div><span class="chip chip-leaf">Работает</span></div></section>
  <section class="sect"><div class="sect-head"><h2>События</h2><span class="muted">почта / Telegram</span></div>
    <div class="card" style="overflow:hidden">${NEV.map(([k,l])=>`<div class="nrow"><span>${l}${k==='access'?'<small>Пароли и ссылки доступа — только на почту</small>':''}</span>
      ${[0,1].map(c=>`<button class="tog ${N[k][c]?'on':''}" ${k==='access'&&c===1?'disabled':''} onclick="togN('${k}',${c})" aria-pressed="${!!N[k][c]}" aria-label="${c?'Telegram':'Почта'}"><i></i></button>`).join('')}</div>`).join('')}</div>
    <p class="fine">Слушатель может отключить необязательные уведомления в профиле. Письма о доступе и документах отключить нельзя.</p></section>`;
}
function togN(k,c){ if(!S.notif) S.notif={newLesson:[1,1],deadline:[1,1],checked:[1,1],answer:[0,1],live:[0,1],access:[1,0]}; S.notif[k][c]=S.notif[k][c]?0:1; save(); const y=scrollY; render(); scrollTo(0,y); }

let loginErr='', pw1='', pw2='';
function loginScreen(){
  return `<div class="login">
    <div class="brand">НУТРИЛОГИЯ</div>
    <div class="brand-sub">Спортивная нутрициология. Программа профессиональной переподготовки, 260 часов</div>
    <div class="brand-track">${MODS.map((m,i)=>`<i style="flex:${m.h};${i<3?'background:var(--leaf)':i===3?'background:var(--cobalt)':''}"></i>`).join('')}</div>
    <h2 style="margin-bottom:14px">Вход для слушателей</h2>
    <label class="field"><span>Электронная почта</span><input id="lg" type="email" autocomplete="username" placeholder="Почта из договора"></label>
    <label class="field"><span>Пароль</span><input id="lp" type="password" autocomplete="current-password" placeholder="Пароль из письма учебного отдела" onkeydown="if(event.key==='Enter')doLogin()"></label>
    ${loginErr?`<div class="err">${loginErr}</div>`:''}
    <button class="btn btn-main btn-block" onclick="doLogin()">Войти</button>
    <button class="btn btn-block" style="margin-top:6px;color:var(--muted);font-weight:600" onclick="toast('Ссылка для сброса отправлена на почту')">Забыли пароль?</button>
    <div class="info">${ic('shield')}<span>Самостоятельной регистрации нет. Доступ выдаёт учебный отдел после зачисления: временный пароль приходит на почту из договора и меняется при первом входе.</span></div>
    <div class="demo"><small>Демо-вход без пароля</small><div class="row">
      <button onclick="demoLogin('student')">Слушатель</button><button onclick="demoLogin('teacher')">Преподаватель</button><button onclick="demoLogin('admin')">Учебный отдел</button></div></div>
  </div>`;
}
function setPwScreen(){
  const r=[[pw1.length>=8,'Не короче 8 символов'],[/[0-9]/.test(pw1)&&/[a-zа-яё]/i.test(pw1),'Буквы и цифры'],[pw1.length>0&&pw1===pw2,'Пароли совпадают']];
  const ok=r.every(x=>x[0])&&S.consent;
  return `<div class="login">
    <small class="muted">Первый вход</small>
    <h1 style="margin:4px 0 8px">Придумайте свой пароль</h1>
    <p class="muted" style="margin:0 0 18px;font-size:15px">Временный пароль из письма больше не сработает. Никому не передавайте доступ: по нему подтверждается, что учились именно вы.</p>
    <label class="field"><span>Новый пароль</span><input type="password" autocomplete="new-password" value="${pw1}" oninput="pw1=this.value;rePw()"></label>
    <label class="field"><span>Повторите пароль</span><input type="password" autocomplete="new-password" value="${pw2}" oninput="pw2=this.value;rePw()"></label>
    <ul class="rules" id="rules">${r.map(x=>`<li class="${x[0]?'ok':''}">${ic('check')}${x[1]}</li>`).join('')}</ul>
    <label class="consent"><input type="checkbox" ${S.consent?'checked':''} onchange="S.consent=this.checked;save();rePw()"><span>Даю согласие на обработку персональных данных, включая СНИЛС и паспортные данные, для выдачи диплома и передачи сведений в ФИС ФРДО</span></label>
    <button class="btn btn-main btn-block" id="pwb" ${ok?'':'disabled'} onclick="S.pwdChanged=true;save();pw1=pw2='';render();toast('Пароль сохранён')">Сохранить и войти</button>
  </div>`;
}
function rePw(){ const y=scrollY; const a=document.activeElement, idx=[...document.querySelectorAll('input')].indexOf(a); render(); const el=document.querySelectorAll('input')[idx]; if(el){el.focus(); if(el.type==='password') el.setSelectionRange(el.value.length,el.value.length);} scrollTo(0,y); }
function genPw(){ const L='ABCDEFGHJKMNPQRSTUVWXYZ'; let t=''; for(let i=0;i<3;i++) t+=L[Math.floor(Math.random()*L.length)]; return `NL-${1000+Math.floor(Math.random()*9000)}-${t}`; }
function adminAct(i){
  const st=S.roster[i], r=ROSTER[i];
  if(st<3){ S.roster[i]=st+1; save(); render(); toast(['Документы проверены','Оплата отмечена','Слушатель зачислен приказом'][st]); return; }
  const p=genPw();
  if(st===3){ S.roster[i]=4; save(); }
  $('#layer').innerHTML=`<div class="layer center"><div class="modal" role="dialog" aria-label="Временный пароль">
    <h2>${st===3?'Доступ выдан':'Пароль сброшен'}</h2>
    <p class="muted" style="margin:6px 0 0;font-size:15px">${r.n}, ${r.e}</p>
    <div class="pw">${p}</div>
    <p class="fine" style="margin:0 0 14px">Пароль виден только сейчас и действует 72 часа. Не пересылайте его в мессенджерах — отправьте письмом на почту из договора.</p>
    <div style="display:grid;gap:8px"><button class="btn btn-main" onclick="closeLayer();render();toast('Письмо с доступом отправлено')">Отправить на почту</button>
      <button class="btn btn-ghost" onclick="closeLayer();render()">Закрыть</button></div></div></div>`;
  render();
}
function doLogin(){
  const e=($('#lg').value||'').trim().toLowerCase(), p=$('#lp').value||'';
  if(!e||!p){ loginErr='Введите почту и пароль'; render(); return; }
  if(!DEMO[e]){ loginErr='Такой слушатель не найден. Проверьте почту из договора или напишите в учебный отдел'; render(); return; }
  loginErr=''; demoLogin(DEMO[e]);
}
function demoLogin(r){ S.auth=r; save(); loginErr=''; tab='home'; ttab='build'; atab='streams'; editing=false; sub=null; reviewing=null; teacher=r==='teacher'; render(); scrollTo(0,0); }
function logout(){ S.auth=null; teacher=false; sub=null; reviewing=null; save(); render(); scrollTo(0,0); }
/* ---------- рендер ---------- */
const TABS=[['home','Главная','home'],['program','Программа','route'],['practice','Практика','runner'],['faculty','Кафедра','users'],['profile','Профиль','user']];
const TTABS=[['build','Уроки','file'],['review','Проверка','inbox'],['stats','Успеваемость','chart'],['mail','Рассылка','bell']];
const ATABS=[['streams','Потоки','users'],['journal','Журнал','grid'],['docs','Документы','award'],['notify','Уведомления','bell']];
function render(){
  const role=S.auth;
  const detail = (role==='student' && sub==='lesson') || (role==='teacher' && ((ttab==='review'&&reviewing!==null) || (ttab==='build'&&editing)));
  $('#app').classList.toggle('sub-mode', detail);
  const bare = !role || (role==='student' && !S.pwdChanged);
  $('#screen').innerHTML = !role ? loginScreen() : role==='admin' ? adminScreen() : role==='teacher' ? teacherScreen() : !S.pwdChanged ? setPwScreen() : sub==='lesson' ? lesson() : {home,program,practice,faculty,profile}[tab]();
  $('#screen').style.padding = bare ? '0' : '';
  const T = role==='teacher'?TTABS:role==='admin'?ATABS:TABS, cur = role==='teacher'?ttab:role==='admin'?atab:tab;
  if(bare || detail){ $('#tabs').innerHTML=''; $('#tabs').style.display='none'; return; }
  $('#tabs').style.display=''; $('#tabs').style.gridTemplateColumns=`repeat(${T.length},1fr)`;
  $('#tabs').innerHTML = T.map(([k,l,i])=>`<button class="${cur===k?'act':''}" onclick="go('${k}')" aria-current="${cur===k?'page':'false'}">${ic(i)}${l}</button>`).join('');
}
function go(k){ if(S.auth==='teacher'){ttab=k;reviewing=null;editing=false;} else if(S.auth==='admin'){atab=k;} else {tab=k; sub=null;} render(); scrollTo(0,0); }

/* ---------- действия ---------- */
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800);}
function floatXP(n,ev){ if(!ev) return; const f=document.createElement('div');f.className='float';f.textContent=`+${n}`;f.style.left=(ev.clientX-14)+'px';f.style.top=(ev.clientY-30)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),900);}
function answerCase(i,ev){ if(S.caseAns!==null) return; S.caseAns=i; if(i===CASE.a){S.xp+=10; floatXP(10,ev);} save(); render(); }
function openLesson(){ sub='lesson'; pane='notes'; render(); scrollTo(0,0); }
function closeSub(){ sub=null; render(); scrollTo(0,0); }
function setPane(k){ pane=k; const y=scrollY; render(); scrollTo(0,y); }
function watch(){ if(S.watched) return; const p=$('#vp'); if(p) requestAnimationFrame(()=>p.style.width='100%'); setTimeout(()=>{S.watched=true;S.xp+=10;save();render();toast('Видео засчитано: +10 опыта');},2400); }
function answerTest(i,j){ S.testAns[i]=j; save(); const y=scrollY; render(); scrollTo(0,y); }
function refresh(){
  const b=$('#sb'), h=$('#hint'); if(!b) return;
  const ok=S.watched && [0,1].every(i=>S.testAns[i]===0) && (S.file||S.answer.trim().length>=30);
  b.disabled=!ok; h.textContent=ok?'После проверки: +50 опыта':!(S.file||S.answer.trim().length>=30)?'Прикрепите файл или опишите решение':h.textContent;
}
function submitWork(){ S.submitted=true; S.xp+=20; save(); pane='task'; render(); toast('Работа отправлена на проверку'); }
function openModule(i){
  const st=modState(i), m=MODS[i];
  if(st==='lock'){ toast(`Модуль откроется ${OPEN_DATES[i]}`); return; }
  const names=m.lessons||Array.from({length:m.l},(_,k)=>`Урок ${k+1}`);
  const done=st==='done'?m.l:S.curDone;
  $('#layer').innerHTML=`<div class="layer" onclick="if(event.target===this)closeLayer()"><div class="sheet" role="dialog" aria-label="${m.t}"><div class="grip"></div>
    <small class="muted">Модуль ${i+1}, ${TEACH[m.tc].n}</small><h2 style="margin:2px 0 14px">${m.t}</h2>
    ${names.map((n,k)=>{const s=k<done?'done':k===done&&st==='cur'?'cur':'next';
      return `<button class="card lv ${s}" ${s==='next'?'disabled':''} onclick="closeLayer();${s==='cur'?'openLesson()':"toast('Урок пройден: материалы доступны в архиве')"}"><span class="st">${s==='done'?ic('check'):k+1}</span><span class="tx">${n}<small>${s==='done'?'Пройден':s==='cur'?'Следующий урок':'Откроется после предыдущего'}</small></span></button>`;}).join('')}
    <p class="fine">Модуль закрывается итоговым тестом и принятой практической работой.</p></div></div>`;
}
function closeLayer(){ $('#layer').innerHTML=''; }
function teacherMode(on){ teacher=on; reviewing=null; sub=null; render(); scrollTo(0,0); }
function decide(ok){ const i=reviewing; S.queue=S.queue.filter(x=>x!==i); reviewing=null; save(); render(); scrollTo(0,0); toast(ok?'Работа принята':'Отправлено на доработку'); }
function resetDemo(){ S=fresh(); teacher=false; sub=null; save(); render(); toast('Демо-данные сброшены'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLayer(); });
render();
</script>
</body>
</html>
